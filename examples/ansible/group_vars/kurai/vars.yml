# Your Kurai: change these. Everything here goes into the host's .env (see roles/kurai/defaults/main.yml for the rest).
kurai_version: "1.8.2"            # the release to run (a tag of this repository without the «v»)
kurai_base_url: https://music.example.org
kurai_dir: /srv/kurai-data        # music, Navidrome's config, the database, the models
kurai_profiles: db,cpu            # db, cpu or gpu, audio (README.md of the repository: «Profiles»)
# any other variable of .env.example, by its name
kurai_env:
  TZ: Europe/Berlin
