# A tag v1.2.3 builds the images and pushes them to ghcr.io/<owner>/kurai:1.2.3 and kurai-audio:1.2.3 (and :latest);
# their build cache is kept as :buildcache next to them
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: kurai, file: Dockerfile}
          - {name: kurai-audio, file: Dockerfile.audio}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the build cache in the registry (a «buildcache» tag), not GitHub's Actions cache: that one is kept per tag,
          # and every release is a new tag, so each release rebuilt the library layers from scratch; rebuilt, they got
          # new digests, and every server downloaded them again (~0.7 GB) though no library had changed
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache,mode=max
