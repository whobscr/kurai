<svg class="art" viewBox="0 0 600 1000" preserveAspectRatio="xMinYMid slice" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="600" height="1000"/>
  <circle class="sc soft" cx="520" cy="80" r="240"/>
  <circle class="pc soft" cx="40" cy="1000" r="230"/>
  <rect class="tc" x="300" y="0" width="70" height="1000" rx="35" opacity=".45"/>
  <!-- the cable arrives from the left edge and runs to the speakers -->
  <path class="line" d="M0 600 C80 560 70 690 150 700 L150 860" stroke-width="10"/>
  <!-- a stack of speakers -->
  <g transform="translate(70 300)">
    <rect class="sc" x="0" y="330" width="210" height="300" rx="26"/>
    <circle class="ink" cx="105" cy="430" r="62"/><circle class="s" cx="105" cy="430" r="40"/><circle class="sc" cx="105" cy="430" r="14"/>
    <circle class="ink" cx="105" cy="560" r="38"/><circle class="s" cx="105" cy="560" r="22"/>
    <rect class="pc" x="20" y="90" width="170" height="230" rx="24"/>
    <circle class="ink" cx="105" cy="170" r="48"/><circle class="p" cx="105" cy="170" r="30"/><circle class="pc" cx="105" cy="170" r="10"/>
    <circle class="ink" cx="105" cy="270" r="28"/><circle class="p" cx="105" cy="270" r="15"/>
  </g>
  <!-- sound -->
  <path class="line" d="M330 450 a70 70 0 0 1 0 100" stroke-width="10"/>
  <path class="line soft" d="M370 410 a120 120 0 0 1 0 180" stroke-width="10"/>
  <path class="line-t" d="M410 370 a170 170 0 0 1 0 260" stroke-width="10" opacity=".3"/>
  <g class="t"><circle cx="420" cy="230" r="13"/><rect x="429" y="160" width="6" height="72" rx="3"/>
    <circle cx="470" cy="216" r="13"/><rect x="479" y="146" width="6" height="72" rx="3"/><rect x="429" y="146" width="56" height="14" rx="4"/></g>
  <g class="p"><circle cx="500" cy="760" r="11"/><rect x="507" y="700" width="5" height="62" rx="2.5"/></g>
</svg>
