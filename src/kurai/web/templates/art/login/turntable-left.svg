<svg class="art" viewBox="0 0 600 1000" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="600" height="1000"/>
  <circle class="pc soft" cx="120" cy="120" r="220"/>
  <circle class="tc soft" cx="560" cy="980" r="260"/>
  <rect class="sc" x="250" y="0" width="70" height="1000" rx="35" opacity=".5"/>
  <!-- a shelf of records -->
  <g transform="translate(330 150)">
    <rect class="sv" x="0" y="150" width="240" height="14" rx="7"/>
    <rect class="p" x="10" y="20" width="26" height="130" rx="6"/><rect class="t" x="40" y="10" width="22" height="140" rx="6"/>
    <rect class="s" x="66" y="34" width="30" height="116" rx="6"/><rect class="pc" x="100" y="16" width="24" height="134" rx="6"/>
    <rect class="tc" x="128" y="40" width="28" height="110" rx="6"/><rect class="p" x="160" y="26" width="22" height="124" rx="6"/>
    <rect class="sc" x="186" y="6" width="34" height="144" rx="6"/>
  </g>
  <!-- the turntable on its stand -->
  <rect class="ol" x="378" y="620" width="16" height="320" rx="8"/><rect class="ol" x="536" y="620" width="16" height="320" rx="8"/>
  <rect class="sv" x="350" y="740" width="230" height="16" rx="8"/>
  <rect class="sc" x="330" y="470" width="260" height="160" rx="28"/>
  <circle class="ink" cx="430" cy="550" r="66"/>
  <circle class="ink" cx="430" cy="550" r="66" opacity=".2"/>
  <circle class="line" cx="430" cy="550" r="48" stroke-width="3" opacity=".5"/>
  <circle class="line" cx="430" cy="550" r="34" stroke-width="3" opacity=".5"/>
  <circle class="p" cx="430" cy="550" r="20"/><circle class="sf" cx="430" cy="550" r="5"/>
  <circle class="ol" cx="540" cy="500" r="14"/>
