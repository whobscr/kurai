  <path class="line" d="M560 620 C560 700 520 640 600 600" stroke-width="10"/>
  <!-- notes rising -->
  <g class="p"><circle cx="300" cy="400" r="12"/><rect x="308" y="340" width="6" height="62" rx="3"/></g>
  <g class="t"><circle cx="250" cy="300" r="10"/><rect x="256" y="250" width="5" height="52" rx="2.5"/>
    <path d="M256 250 q28 6 26 30" fill="none" stroke="var(--tertiary)" stroke-width="5" stroke-linecap="round"/></g>
